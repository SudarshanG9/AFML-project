# CPU-only CI. Needs no datasets, checkpoints, credentials or GPU: every test uses synthetic
# temporary data and mock adapters. A green run shows the software works; it is NOT evidence
# of detector accuracy, benchmark results or held-out-test validity.
name: ci

on:
  push:
    branches: [main, "feature/**", member1, member2, member3, "member3/**", frontend, "integration/afml-frontend"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU-only torch, then bundled workbench + dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[workbench,dev]"
          python -m pip check
      - name: Lint (Member 3 scope)
        # The rest of the repository has pre-existing Ruff findings owned by other members;
        # widen this path list only once those are fixed.
        run: python -m ruff check src/avfuse/member3_runtime tests/member3
      - name: Consolidated backend tests (private fixtures skip conditionally)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q tests
      - name: Frontend tests
        # Root pytest config discovers tests/ only; expose the frontend package explicitly.
        env:
          PYTHONPATH: frontend:src
        run: python -m pytest -q frontend/tests
      - name: Frontend correctness lint
        run: python -m ruff check --select F frontend
      - name: Compile frontend modules
        run: python -m compileall -q frontend/avfuse_ui frontend/app.py
      - name: CLI smoke (no model, no data)
        run: |
          python -m avfuse.member3_runtime.cli --help
          python -m avfuse.member3_runtime.cli run --help
          python -m avfuse.member3_runtime.cli --smoke
