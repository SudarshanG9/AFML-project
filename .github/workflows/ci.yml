# CPU-only CI. Needs no datasets, checkpoints, credentials or GPU: every test uses synthetic
# temporary data and mock adapters. A green run shows the software works; it is NOT evidence
# of detector accuracy, benchmark results or held-out-test validity.
name: ci

on:
  push:
    branches: [main, "feature/**", member1, member2, member3, frontend]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU-only torch, then the project with dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
          python -m pip install -r frontend/requirements.txt
      - name: Lint (Member 3 scope)
        # The rest of the repository has pre-existing Ruff findings owned by other members;
        # widen this path list only once those are fixed.
        run: python -m ruff check src/avfuse/member3_runtime tests/member3
      - name: Repository tests (excluding local-only Member 1 Day C package fixtures)
        # These two Member 1 test modules require ignored/local artifacts that are not present
        # in a clean GitHub checkout. Their source and fixtures remain owned by Member 1.
        # Do not replace or synthesize the approved package/prediction assets in CI.
        run: |
          python -m pytest -q \
            --ignore=tests/member1/test_dayc_colab_pilot.py \
            --ignore=tests/member1/test_dayc_execution_package.py
      - name: Frontend tests
        # Root pytest.ini only discovers tests/, so the frontend suite must be invoked explicitly.
        run: python -m pytest -q frontend/tests
      - name: Compile frontend modules
        run: python -m compileall -q frontend/avfuse_ui frontend/app.py
      - name: CLI smoke (no model, no data)
        run: |
          python -m avfuse.member3_runtime.cli --help
          python -m avfuse.member3_runtime.cli run --help
          python -m avfuse.member3_runtime.cli --smoke
